[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-angel"
version = "1.0.0"
description = "On-device multimodal safety investigator: perception, agentic reasoning, adversarial critic and policy-gated action on one edge computer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5", "PyYAML>=6.0,<7", "networkx>=3.2,<4", "psutil>=5.9,<8",
                "httpx>=0.27,<1", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9",
                "sse-starlette>=2.1", "pydantic>=2.6,<3", "requests>=2.31,<3"]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "lap>=0.5.12", "torchvision>=0.20", "onnxruntime>=1.18", "huggingface_hub>=0.25"]
audio = ["faster-whisper>=1.1,<2", "soundfile>=0.12", "scipy>=1.11", "transformers>=4.49,<6", "detoxify>=0.5.2", "librosa>=0.10"]
train = ["datasets>=3.2,<5", "kokoro>=0.9.2", "scikit-learn>=1.5,<2", "onnx>=1.16"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "playwright>=1.45"]

[project.scripts]
personal-angel = "personal_angel.cli:main"

[tool.setuptools.packages.find]
include = ["personal_angel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"
